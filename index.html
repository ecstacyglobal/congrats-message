<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congratulations!</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ff8fb3, #ffd9e6);
    overflow: hidden;
    position: relative;
  }

  canvas#confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
  }

  .scene {
    position: relative;
    text-align: center;
    padding: 20px;
    z-index: 5;
  }

  .instruction {
    color: #7a2e46;
    font-size: 16px;
    margin-bottom: 20px;
    font-weight: 600;
    opacity: 0.9;
    animation: fadePulse 1.6s ease-in-out infinite;
  }

  @keyframes fadePulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .avatars-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .baby {
    width: 110px;
    animation: dance 0.9s ease-in-out infinite;
  }

  .baby.left {
    animation-delay: 0s;
    margin-right: -10px;
  }

  .baby.right {
    animation-delay: 0.45s;
    margin-left: -10px;
    transform: scaleX(-1);
  }

  @keyframes dance {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-10px) rotate(4deg); }
  }

  .baby.right.dance {
    /* keep flipped while dancing */
  }

  .popper {
    width: 70px;
    position: relative;
    top: 10px;
    animation: shake 0.5s ease-in-out infinite;
    transform-origin: bottom center;
  }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-6deg); }
    75% { transform: rotate(6deg); }
  }

  .hidden {
    display: none !important;
  }

  .message-card {
    opacity: 0;
    transform: scale(0.85);
    background-color: #ffffff;
    border-radius: 20px;
    padding: 44px 36px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .message-card.show {
    opacity: 1;
    transform: scale(1);
  }

  .message-card .emoji {
    font-size: 50px;
    margin-bottom: 14px;
  }

  .message-card h1 {
    color: #b3286e;
    font-size: 26px;
    line-height: 1.4;
  }

  .message-card p {
    color: #666;
    font-size: 15px;
    margin-top: 12px;
  }
</style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="scene" id="scene">
    <div class="instruction" id="instruction">Tap the crystal to pop it! 🎊</div>

    <div class="avatars-row" id="popperGroup">
      <svg class="baby left" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="150" rx="22" ry="6" fill="rgba(0,0,0,0.1)"/>
        <path d="M25 110 Q20 80 45 70 L75 70 Q95 85 88 115 Q80 140 60 140 Q35 140 25 110Z" fill="#ff6f91"/>
        <circle cx="60" cy="45" r="34" fill="#ffd8b8"/>
        <path d="M27 40 Q30 8 60 8 Q90 8 93 40 Q80 20 60 22 Q40 20 27 40Z" fill="#5a3825"/>
        <circle cx="48" cy="48" r="4.5" fill="#3a2b23"/>
        <circle cx="72" cy="48" r="4.5" fill="#3a2b23"/>
        <path d="M50 62 Q60 70 70 62" stroke="#3a2b23" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="42" cy="58" r="5" fill="#ff9eb0" opacity="0.7"/>
        <circle cx="78" cy="58" r="5" fill="#ff9eb0" opacity="0.7"/>
        <path d="M20 95 Q5 95 8 78" stroke="#ffd8b8" stroke-width="12" fill="none" stroke-linecap="round"/>
        <path d="M95 95 Q112 88 108 70" stroke="#ffd8b8" stroke-width="12" fill="none" stroke-linecap="round"/>
      </svg>

      <svg class="popper" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="132" rx="10" ry="5" fill="rgba(0,0,0,0.12)"/>
        <path d="M35 100 L65 100 L58 40 Q50 20 42 40 Z" fill="#ffe066" stroke="#e6b800" stroke-width="2"/>
        <path d="M35 100 L65 100 L68 128 Q50 138 32 128 Z" fill="#ff6f91" stroke="#d94f74" stroke-width="2"/>
        <circle cx="50" cy="35" r="6" fill="#ff4d6d"/>
        <circle cx="40" cy="42" r="4" fill="#4dd2ff"/>
        <circle cx="60" cy="42" r="4" fill="#4dff88"/>
      </svg>

      <svg class="baby right" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="150" rx="22" ry="6" fill="rgba(0,0,0,0.1)"/>
        <path d="M25 110 Q20 80 45 70 L75 70 Q95 85 88 115 Q80 140 60 140 Q35 140 25 110Z" fill="#4dd2ff"/>
        <circle cx="60" cy="45" r="34" fill="#ffd8b8"/>
        <path d="M27 40 Q30 8 60 8 Q90 8 93 40 Q80 20 60 22 Q40 20 27 40Z" fill="#2b2118"/>
        <circle cx="48" cy="48" r="4.5" fill="#3a2b23"/>
        <circle cx="72" cy="48" r="4.5" fill="#3a2b23"/>
        <path d="M50 62 Q60 70 70 62" stroke="#3a2b23" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="42" cy="58" r="5" fill="#ff9eb0" opacity="0.7"/>
        <circle cx="78" cy="58" r="5" fill="#ff9eb0" opacity="0.7"/>
        <path d="M20 95 Q5 95 8 78" stroke="#ffd8b8" stroke-width="12" fill="none" stroke-linecap="round"/>
        <path d="M95 95 Q112 88 108 70" stroke="#ffd8b8" stroke-width="12" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="message-card" id="messageCard">
      <div class="emoji">🎉</div>
      <h1>Congratulations my Stubborn Girl!</h1>
      <p>On your project approval — so proud of you!</p>
    </div>
  </div>

  <script>
    const popperGroup = document.getElementById('popperGroup');
    const instruction = document.getElementById('instruction');
    const messageCard = document.getElementById('messageCard');
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const colors = ['#ffcc00', '#ff4d6d', '#4dd2ff', '#4dff88', '#c94dff', '#ffffff', '#ff8fb3'];
    let pieces = [];
    let animating = false;
    let elapsed = 0;
    const duration = 4500;
    let lastTime = null;

    function createPiece() {
      return {
        x: canvas.width / 2 + (Math.random() - 0.5) * 80,
        y: canvas.height / 2 - 60,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: 2 + Math.random() * 4,
        speedX: -6 + Math.random() * 12,
        gravity: 0.12,
        rotation: Math.random() * 360,
        rotationSpeed: -8 + Math.random() * 16,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      };
    }

    function launchConfetti() {
      pieces = [];
      for (let i = 0; i < 180; i++) {
        pieces.push(createPiece());
      }
      elapsed = 0;
      lastTime = null;
      animating = true;
      requestAnimationFrame(animate);
    }

    function animate(now) {
      if (!lastTime) lastTime = now;
      const dt = now - lastTime;
      lastTime = now;
      elapsed += dt;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      pieces.forEach(p => {
        p.speedY += p.gravity * 0.15;
        p.y += p.speedY;
        p.x += p.speedX;
        p.rotation += p.rotationSpeed;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;

        if (p.shape === 'rect') {
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      if (elapsed < duration && animating) {
        requestAnimationFrame(animate);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        animating = false;
      }
    }

    popperGroup.addEventListener('click', () => {
      if (popperGroup.classList.contains('hidden')) return;

      popperGroup.classList.add('hidden');
      instruction.classList.add('hidden');
      launchConfetti();

      setTimeout(() => {
        messageCard.classList.add('show');
      }, 150);
    });
  </script>

</body>
</html>
